# Standalone deployment file: the application source is not needed on the server.
services:
  tracker:
    image: ${AIOSYNC_IMAGE:-ghcr.io/docloulou/aiosync:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:?Configure GLOBAL_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configure ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Configure PUBLIC_BASE_URL}
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      SIMKL_CLIENT_SECRET: ${SIMKL_CLIENT_SECRET:-}
      SIMKL_ACCESS_TOKEN: ${SIMKL_ACCESS_TOKEN:-}
      PMDB_API_KEY: ${PMDB_API_KEY:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      MAX_PULL_BYTES: ${MAX_PULL_BYTES:-4900000}
      MAX_RESUME_ITEMS: ${MAX_RESUME_ITEMS:-5000}
      MAX_WATCHED_MOVIES: ${MAX_WATCHED_MOVIES:-50000}
      MAX_WATCHED_EPISODES: ${MAX_WATCHED_EPISODES:-50000}
      HOST: 0.0.0.0
      PORT: '7000'
      DATA_DIR: /app/data
    ports:
      - '${HOST_BIND:-127.0.0.1}:${HOST_PORT:-7000}:7000'
    volumes:
      - tracker-data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  tracker-data:
